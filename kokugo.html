<head>

  <style>
    * {

    body {
      margin: 0;

      background: white;
      color: black;
    }

    .container {
      display: flex;
      max-width: 1200px;
      margin: 30px auto;
      border: 1px solid black;
    }

    .side-menu {

      padding: 20px;

    }

   .content {

}

.content iframe {

  border: none;
}


    .grade summary {
      cursor: pointer;
      font-weight: bold;
      padding: 8px;
      border: 1px solid black;
    }

    .side-menu a {
      display: block;
      padding: 8px;
      color: black;
    }

</head>

<body>

  <div class="container">

    <aside class="side-menu">


      <h2>国語</h2>

 <a href="setting.html" target="math-content">★ 推し設定</a>

<main class="content">

 <iframe
  name="math-content">
</iframe>

  </div>

<script>

  const links = document.querySelectorAll(".side-menu a");
  const topMessage = document.getElementById("top-message");
  const iframe = document.querySelector(".content iframe");

  links.forEach(function(link) {

    link.addEventListener("click", function() {

      topMessage.style.display = "none";
      iframe.style.display = "block";

    });

  });

</script>
