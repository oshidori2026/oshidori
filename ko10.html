<body>

 
  <div class="page">

    <h1>Day.10　読みの練習</h1>

  



  <!-- 問題文 -->
  <div class="part-a-text">


<strong id="oshiName2"></strong>の日記<br>
<br>
今日は<strong class="a-name"></strong>に誘われて、パーティに行った。<br>
<span class="part-a-word"><span class="part-a-number">①</span>国際的</span>なパーティで、外国人も沢山。なんと、<span class="part-a-word"><span class="part-a-number">②</span>総理大臣</span>の知り合いと言う人までいた！<br>
<strong class="a-name"></strong>は実は<ruby>建築士<rt>けんちくし</rt></ruby>の<span class="part-a-word"><span class="part-a-number">③</span>資格</span>を持ってるから、<ruby>立派<rt>りっぱ</rt></ruby>な建物の<span class="part-a-word"><span class="part-a-number">④</span>構造</span>に<span class="part-a-word"><span class="part-a-number">⑤</span>興味</span><ruby>津々<rt>しんしん</rt></span>だった。<br>
カッコイイなぁ。

  </div>

<div class="part-a-area">


  <!-- 解答エリア -->
<div class="part-a-answer-area">

    <div class="part-a-answer-list">

      <div class="part-a-answer-column">

        <div class="part-a-answer-item">
          <span class="part-a-answer-number">①</span>
          <input type="text" id="answer1" inputmode="hiragana" autocomplete="off">
<span class="result" id="result1"></span>
        </div>

        <div class="part-a-answer-item">
          <span class="part-a-answer-number">④</span>
          <input type="text" id="answer4" inputmode="hiragana" autocomplete="off">
<span class="result" id="result4"></span>
        </div>


      </div>

      <div class="part-a-answer-column">

        <div class="part-a-answer-item">
          <span class="part-a-answer-number">②</span>
          <input type="text" id="answer2" inputmode="hiragana" autocomplete="off">
<span class="result" id="result2"></span>
        </div>

        <div class="part-a-answer-item">
          <span class="part-a-answer-number">⑤</span>
          <input type="text" id="answer5" inputmode="hiragana" autocomplete="off">
<span class="result" id="result5"></span>
        </div>

 

      </div>

<div class="part-a-answer-column">

        <div class="part-a-answer-item">
          <span class="part-a-answer-number">③</span>
          <input type="text" id="answer3" inputmode="hiragana" autocomplete="off">
<span class="result" id="result3"></span>
        </div>


      </div>


    </div> 

<br>

   <button
  type="button"
  class="check-button"
  onclick="checkAnswers()">
  答え合わせ
</button>

<button
  type="button"
  class="check-button"
  onclick="showReadingAnswer()">
  正解を見る
</button>

<br>
<div id="part-a-answer" class="part-a-answer"></div>

  </div>






<script>

const savedSettings =
  localStorage.getItem("oshiDoriSettings");

let oshiSettings = null;

let mainName = "あなた";
let oshiNames = [];


if (savedSettings) {
  try {
    oshiSettings = JSON.parse(savedSettings);
  } catch (error) {
    console.log("推し設定の読み込みに失敗しました。");
  }
}


if (oshiSettings && oshiSettings.mainCharacter) {
  mainName = oshiSettings.mainCharacter;
}


function prepareOshiNames() {

  if (
    oshiSettings &&
    oshiSettings.names &&
    oshiSettings.names.length > 0
  ) {
    oshiNames = [...oshiSettings.names];

  } else {

    oshiNames = [
      "はる",
      "あき",
      "そら",
      "ゆう",
      "りん",
      "なお",
      "けい",
      "まお",
      "つばさ",
      "ひなた"
    ];
  }

  oshiNames.sort(() => Math.random() - 0.5);
}


function getNextOshiName() {

  if (oshiNames.length === 0) {
    prepareOshiNames();
  }

  return oshiNames.shift();
}

const oshiName2 = getNextOshiName();
const oshiName3 = getNextOshiName();

document.getElementById("oshiName2").textContent = oshiName2;

document.querySelectorAll(".a-name").forEach(element => {
  element.textContent = oshiName3;
});





function checkAnswers() {

  const answers = [
    "こくさいてき",
    "そうりだいじん",
    "しかく",
    "こうぞう",
    "きょうみ"
];


  for (let i = 0; i < answers.length; i++) {

    const input =
      document.getElementById("answer" + (i + 1));

    const result =
      document.getElementById("result" + (i + 1));

    const userAnswer =
      input.value.trim();


    if (userAnswer === answers[i]) {

      result.textContent = "○";
      result.style.color = "red";

    } else {

     result.textContent = "× ";
  result.style.color = "#555";

    }

  }

}


function showReadingAnswer() {

  const answer =
    document.getElementById("part-a-answer");

  answer.innerHTML =
    "① こくさいてき　② そうりだいじん　③ しかく　④ こうぞう　⑤ きょうみ";

}

</script>

<strong id="oshiName1"></strong>の夢<br>
<br>
<ruby>将来<rt>しょうらい</rt></ruby>は<span class="part-b-word"><span class="part-b-number">①</span>ゆた</span>かな緑を<span class="part-b-word"><span class="part-b-number">②</span>ほご</span>し、<span class="part-b-word"><span class="part-b-number">③</span>ぎゅうしゃ</span>で牛を<span class="part-b-word"><span class="part-b-number">④</span>か</span>い、畑を<span class="part-b-word"><span class="part-b-number">⑤</span>たがや</span>し、自然の中で暮らしたいな。<br>

動物が好きだから<span class="part-b-word"><span class="part-b-number">⑥</span>ぞうきばやし</span>で<span class="part-b-word"><span class="part-b-number">⑦</span>ぞう</span>を育てたり...なんちゃって。<br>

とにかくゆったり暮らしたいな。

}

</script>
