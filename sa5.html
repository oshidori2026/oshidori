  <script>


    /* =========================

       ========================= */

    const correctAnswers = [

      "4",

      ["8","0.6"],
      "2",
      "20",
      "7",
      ["6","70"],
      "8",
      "9"

    ];



    /* =========================
       推し設定を読み込む
       ========================= */

    const savedSettings =
      localStorage.getItem("oshiDoriSettings");

    let oshiSettings = null;


let mainName = "あなた";
let oshiNames = [];


    if (savedSettings) {

      try {

        oshiSettings =
          JSON.parse(savedSettings);

      } catch (error) {

        console.log(
          "推し設定の読み込みに失敗しました。"
        );

      }

    }

function prepareOshiNames() {

  if (
    oshiSettings &&
    oshiSettings.names &&
    oshiSettings.names.length > 0
  ) {

    oshiNames = [...oshiSettings.names];

  } else {

    oshiNames = [
      "はる",
      "あき",
      "そら",
      "ゆう",
      "りん",
      "なお",
      "けい",
      "まお",
      "つばさ",
      "ひなた"
    ];

  }

  oshiNames.sort(() => Math.random() - 0.5);

}


function getNextOshiName() {

  if (oshiNames.length === 0) {
    prepareOshiNames();
  }

  return oshiNames.shift();

}



function createQuestion1() {

  if (oshiSettings && oshiSettings.mainCharacter) {
    mainName = oshiSettings.mainCharacter;
  }

"<strong>" + oshiName1 + "</strong>は、クレーンゲームで2.4㎏のお菓子をゲットしました。<br>"+
"たくさん取れたので、みんなに0.6㎏ずつプレゼントすることにしました。<br>"+
"何人にあげられますか。";

}

function selectAnswer1(button, answer) {

    /* =========================
       答え合わせ
       ========================= */


function checkAllAnswers() {

  let score = 0;

  for (let i = 1; i <= 10; i++) {

    const result =
      document.getElementById("result" + i);


    // =========================
    // 第4.8問だけ答えが2つ
    // =========================

    
if (i === 4 || i === 8) {

  const inputA =
    document.getElementById("answer" + i + "a");

  const inputB =
    document.getElementById("answer" + i + "b");


  const userAnswerA =
    inputA.value
      .replace(/[０-９]/g, function(s) {
        return String.fromCharCode(
          s.charCodeAt(0) - 0xFEE0
        );
      })
      .replace(/[ 　]/g, "")
      .trim();


  const userAnswerB =
    inputB.value
      .replace(/[０-９]/g, function(s) {
        return String.fromCharCode(
          s.charCodeAt(0) - 0xFEE0
        );
      })
      .replace(/[ 　]/g, "")
      .trim();


  const correctAnswerA =
    correctAnswers[i - 1][0];

  const correctAnswerB =
    correctAnswers[i - 1][1];


  if (
    userAnswerA !== "" &&
    userAnswerB !== "" &&
    userAnswerA === correctAnswerA &&
    userAnswerB === correctAnswerB
  ) {

    score++;

    result.textContent =
      "○ 正解！";

  } else {

    result.textContent =
      "✕ 不正解";

  }


  result.style.display = "block";

  continue;

}

    // =========================
    // 第4.8問以外
    // =========================

    const input =
      document.getElementById(
        "answer" + i
      );


    const userAnswer =
      input.value
        .replace(/[０-９]/g, function(s) {
          return String.fromCharCode(
            s.charCodeAt(0) - 0xFEE0
          );
        })
        .replace(/[ 　]/g, "")
        .trim();


    const correctAnswer =
      correctAnswers[i - 1]
        .replace(/[０-９]/g, function(s) {
          return String.fromCharCode(
            s.charCodeAt(0) - 0xFEE0
          );
        })
        .replace(/[ 　]/g, "")
        .trim();


    if (
      userAnswer !== "" &&
      userAnswer === correctAnswer
    ) {

      score++;

      result.textContent =
        "○ 正解！";

    } else {

      result.textContent =
        "✕ 不正解";

    }


    result.style.display = "block";

  }


  /* =========================
     合計結果
     ========================= */

  document.getElementById(
    "scoreNumber"
  ).textContent = score;


  let message = "";


  if (score === 10) {

    message =
      "🎉 全問正解！すごい！";

  } else if (score >= 8) {

    message =
      "🌟 よくできました！あと少し！";

  } else if (score >= 5) {

    message =
      "👍 がんばったね！もう一度挑戦してみよう！";

  } else {

    message =
      "💪 もう一度チャレンジしてみよう！";

  }


  document.getElementById(
    "resultMessage"
  ).textContent = message;


  document.getElementById(
    "totalResult"
  ).style.display = "block";


  document.getElementById(
    "afterButtons"
  ).style.display = "block";


  document.getElementById(
    "totalResult"
  ).scrollIntoView({
    behavior: "smooth"
  });

}


/* =========================
   もう一度挑戦
   ========================= */

function retryQuiz() {

  for (let i = 1; i <= 10; i++) {

    // 第4問
    if (i === 4) {

      document.getElementById(
        "answer4a"
      ).value = "";

      document.getElementById(
        "answer4b"
      ).value = "";

    } else {

      document.getElementById(
        "answer" + i
      ).value = "";

    }


    document.getElementById(
      "result" + i
    ).style.display = "none";

  }


  document.getElementById(
    "totalResult"
  ).style.display = "none";


  document.getElementById(
    "afterButtons"
  ).style.display = "none";


  document.querySelectorAll(
    ".choice-button"
  ).forEach(function(button) {

    button.classList.remove("selected");

  });


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}
