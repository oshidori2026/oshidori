  <script>


    /* =========================
       正解データ

       ========================= */

    const correctAnswers = [

      "35",
      "420",
      "56",
      "7.2",
      "9",
      "25.2",
      "4.8",
      "9.4",
      "15",
      "11.7"

    ];



    /* =========================
       推し設定を読み込む
       ========================= */

    const savedSettings =
      localStorage.getItem("oshiDoriSettings");

    let oshiSettings = null;


let mainName = "あなた";
let oshiNames = [];


    if (savedSettings) {

      try {

        oshiSettings =
          JSON.parse(savedSettings);

      } catch (error) {

        console.log(
          "推し設定の読み込みに失敗しました。"
        );

      }

    }

function prepareOshiNames() {

  if (
    oshiSettings &&
    oshiSettings.names &&
    oshiSettings.names.length > 0
  ) {

    oshiNames = [...oshiSettings.names];

  } else {

    oshiNames = [
      "はる",
      "あき",
      "そら",
      "ゆう",
      "りん",
      "なお",
      "けい",
      "まお",
      "つばさ",
      "ひなた"
    ];

  }

  oshiNames.sort(() => Math.random() - 0.5);

}


function getNextOshiName() {

  if (oshiNames.length === 0) {
    prepareOshiNames();
  }

  return oshiNames.shift();

}



function createQuestion1() {

  if (oshiSettings && oshiSettings.mainCharacter) {
    mainName = oshiSettings.mainCharacter;
  }

  const oshiName1 = getNextOshiName();

  document.getElementById("questionText1").innerHTML =

"<strong>" + mainName + "</strong>は"+
"<strong>" + oshiName1 + "</strong>のライブで3.5mの銀テープをゲットしました。<br>"+
"このテープの長さを10倍したら、何mになるでしょぅか。";

}

"すると、魔法使いの"+
"<strong>" + oshiName3 + "</strong>がやって来て「100倍にしてあげよう!」と魔法をかけました。<br>"+
"チョコレートは何グラムになりましたか。";

}

function selectAnswer1(button, answer) {

  document.getElementById("answer1").value = answer;

  const buttons =
    button.parentElement.querySelectorAll(".choice-button");

  buttons.forEach(function(btn) {
    btn.classList.remove("selected");
  });

  button.classList.add("selected");
}







    /* =========================
       答え合わせ
       ========================= */

    function checkAllAnswers() {


      let score = 0;


      for (
        let i = 1;
        i <= 10;
        i++
      ) {


        const input =
          document.getElementById(
            "answer" + i
          );


        const result =
          document.getElementById(
            "result" + i
          );

const userAnswer =
  input.value
    .replace(/[０-９]/g, function(s) {
      return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
    })
    .replace(/[ 　]/g, "")
    .trim();


const correctAnswer =
  correctAnswers[i - 1]
    .replace(/[０-９]/g, function(s) {
      return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
    })
    .replace(/[ 　]/g, "")
    .trim();


if (
  userAnswer !== "" &&
  userAnswer === correctAnswer
) {
     

          score++;


          result.textContent =
            "○ 正解！";

        } else {

          result.textContent =
            "✕ 不正解";

        }


        result.style.display =
          "block";

      }



      /* =========================
         合計結果
         ========================= */

      document.getElementById(
        "scoreNumber"
      ).textContent = score;


      let message = "";


      if (score === 10) {

        message =
          "🎉 全問正解！すごい！";

      } else if (score >= 8) {

        message =
          "🌟 よくできました！あと少し！";

      } else if (score >= 5) {

        message =
          "👍 がんばったね！もう一度挑戦してみよう！";

      } else {

        message =
          "💪 もう一度チャレンジしてみよう！";

      }


      document.getElementById(
        "resultMessage"
      ).textContent = message;


      document.getElementById(
        "totalResult"
      ).style.display = "block";


      document.getElementById(
        "afterButtons"
      ).style.display = "block";


      /* 結果までスクロール */

      document.getElementById(
        "totalResult"
      ).scrollIntoView({
        behavior: "smooth"
      });

    }



    /* =========================
       もう一度挑戦
       ========================= */

    function retryQuiz() {


      for (
        let i = 1;
        i <= 10;
        i++
      ) {


        document.getElementById(
          "answer" + i
        ).value = "";


        document.getElementById(
          "result" + i
        ).style.display = "none";

      }


      document.getElementById(
        "totalResult"
      ).style.display = "none";


      document.getElementById(
        "afterButtons"
      ).style.display = "none";


  document.querySelectorAll(".choice-button").forEach(function(button) {
        button.classList.remove("selected");
      });


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }

createQuestion1();

</script>
